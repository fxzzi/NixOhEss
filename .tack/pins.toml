# tack pins. edit by hand or with tack add / rm / alias

[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
fazzi   = "gitlab:fazzi/{path}"
raf     = "git+ssh://git@git.notashelf.dev:33/notashelf/{path}"

[all_follow]
nixpkgs = "nixpkgs"
systems = "systems"

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
names = ["nixpkgs-ci", "flake-compat", "pre-commit-hooks"]

# core
[inputs.nixpkgs]
url = "channel:nixos-unstable"
patches = [
  # nvtop: 3.3.2 -> 3.4.0, merge nvtopPackages into a single package 
  "https://github.com/NixOS/nixpkgs/pull/586196",
  # mpd: 0.24.18 -> 0.24.20
  "https://github.com/NixOS/nixpkgs/pull/592049",
  # librewolf-bin-unwrapped: 160.0-1 -> 160.0.1-1
  "https://github.com/NixOS/nixpkgs/pull/592033",
  # proton-ge-bin: GE-Proton11-12 -> GE-Proton11-14
  "https://github.com/NixOS/nixpkgs/pull/593147",
  # tuigreet: 0.11.1 -> 0.11.2
  "https://github.com/NixOS/nixpkgs/pull/593205",
  # lutris-unwrapped: 0.5.22 -> 0.5.23
  "https://github.com/NixOS/nixpkgs/pull/593409",
  # tack: 1.0.1 -> 2.0.0
  "https://github.com/NixOS/nixpkgs/pull/593888",
  # # tack: install shell completions, add qweered to maintainers
  "https://github.com/NixOS/nixpkgs/pull/593975",
  # ncro: init at 2.4.0; init module
  "https://github.com/NixOS/nixpkgs/pull/533027",
]
[inputs.systems]
url = "github:nix-systems/x86_64-linux"
[inputs.hjem]
url = "github:feel-co/hjem"
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"
[inputs.agenix]
url = "github:ryantm/agenix"

# things from yours truly
[inputs.azzipkgs]
url = "fazzi:azzipkgs"
[inputs.startpage]
url  = "fazzi:startpage"
type = "fetch"
[inputs.walls]
url  = "fazzi:walls"
type = "fetch"
[inputs.creamlinux]
url = "github:fxzzi/creamlinux-installer"

# raf stuff :D
[inputs.nvf]
url = "github:NotAShelf/nvf"
[inputs.rags]
url = "github:NotAShelf/rags"
[inputs.beer]
url = "raf:beer"
[inputs.chroma]
url = "raf:chroma"

# everything else
[inputs.hyprland]
url = "github:hyprwm/Hyprland"
patches = [
  # pointer: use plane size hints for HW cursor
  "https://github.com/hyprwm/Hyprland/pull/17042",
  # compositor: session stop changes
  "https://github.com/hyprwm/Hyprland/pull/17098",
  # input: pointer focus from bg layer fixes
  "https://github.com/hyprwm/Hyprland/pull/17106",
]

[inputs.niqspkgs]
url  = "github:diniamo/niqspkgs"
type = "fetch"

[inputs.nix-gaming]
url  = "github:fufexan/nix-gaming"
type = "fetch"

[inputs.nixcord]
url  = "github:4evy/nixcord"
type = "fetch"

# non-flake inputs
[inputs.KvLibadwaita]
url  = "github:GabePoel/KvLibadwaita"
type = "fetch"

[inputs.tom-nvidia-patches]
url    = "https://github.com/gulafaran/open-gpu-kernel-modules/compare/main...patches.diff"
type   = "fixed"
unpack = "file"

[inputs.disblock-origin]
url     = "git+https://codeberg.org/AllPurposeMat/Disblock-Origin"
type    = "fetch"
patches = ["https://codeberg.org/AllPurposeMat/Disblock-Origin/pulls/163"]
