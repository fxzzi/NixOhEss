# tack pins. edit by hand or with tack add / rm / alias
# nix reads pins.lock.json; this file drives tack update

# shorturl schemes. scheme:rest expands rest into {path}
[shorturls]
fazzi = "gitlab:fazzi/{path}"
raf   = "git+https://git.notashelf.dev/notashelf/{path}.git"

# all_follow: input name -> top-level pin it follows wherever it appears
# opt out per-input with exclude_follow
[all_follow]
nixpkgs = ["nixpkgs-nixcord"]

# auto-dedup (no top-level pin needed):
flake-parts = ["flake-parts"]
git-hooks   = ["pre-commit-hooks"]

# [inputs.<name>] fields
#   url             required, shorturl ok; ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only: tarball or file
[inputs.nixpkgs]
url = "github:NixOS/nixpkgs/nixos-unstable"
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"
[inputs.hjem]
url = "github:feel-co/hjem"

[inputs.azzipkgs]
url = "fazzi:azzipkgs"
[inputs.evoctl-nix]
url = "fazzi:evoctl-nix"
[inputs.nvuv]
url = "fazzi:nvuv"
[inputs.startpage]
url  = "fazzi:startpage"
type = "fetch"
[inputs.walls]
url  = "fazzi:walls"
type = "fetch"
[inputs.creamlinux]
url = "github:fxzzi/creamlinux-installer"

[inputs.nvf]
url = "github:NotAShelf/nvf"
[inputs.rags]
url = "github:NotAShelf/rags"
[inputs.beer]
# nix fails to fetch from raf's git forge :(
# so fetch from github mirror instead
# url = "raf:beer"
url = "github:Michael-C-Buckley/beer"
[inputs.chroma]
url = "raf:chroma"

[inputs.hyprland]
url = "github:hyprwm/Hyprland"

[inputs.agenix]
url = "github:ryantm/agenix"

[inputs.niqspkgs]
url = "github:diniamo/niqspkgs"

[inputs.nix-gaming]
url = "github:fufexan/nix-gaming"

[inputs.nixcord]
url = "github:4evy/nixcord"

[inputs.nvidia-vaapi-driver]
url  = "github:elFarto/nvidia-vaapi-driver"
type = "fetch"

[inputs.KvLibadwaita]
url  = "github:GabePoel/KvLibadwaita"
type = "fetch"
