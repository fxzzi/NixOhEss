# tack pins. edit by hand or with tack add / rm / alias

[shorturls]
fazzi   = "gitlab:fazzi/{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[all_follow]
nixpkgs = "nixpkgs"
systems = "systems"

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
names = ["nixpkgs-ci", "flake-compat", "pre-commit-hooks"]

# core
[inputs.nixpkgs]
url = "channel:nixos-unstable"
patches = [
  # stremio-linux-shell: 1.2.2 -> 1.2.3
  "https://github.com/NixOS/nixpkgs/pull/589183",
  # stremio-linux-shell: 1.2.3 -> 1.3.0
  "https://github.com/NixOS/nixpkgs/pull/589700",
]
[inputs.systems]
url = "github:nix-systems/x86_64-linux"
[inputs.hjem]
url = "github:feel-co/hjem"
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"
[inputs.ncro]
url  = "github:manic-systems/ncro"
type = "fetch"
[inputs.tack]
url  = "github:manic-systems/tack"
type = "fetch"
[inputs.agenix]
url  = "github:ryantm/agenix"
type = "fetch"

# things from yours truly
[inputs.azzipkgs]
url = "fazzi:azzipkgs"
[inputs.startpage]
url  = "fazzi:startpage"
type = "fetch"
[inputs.walls]
url  = "fazzi:walls"
type = "fetch"
[inputs.creamlinux]
url  = "github:fxzzi/creamlinux-installer"
type = "fetch"

# raf stuff :D
[inputs.nvf]
url = "github:NotAShelf/nvf"
[inputs.rags]
url  = "github:NotAShelf/rags"
type = "fetch"
[inputs.beer]
# nix and tack fail to fetch from raf's git forge :(
# so fetch from a mirror instead
# url = "git+https://git.notashelf.dev/notashelf/beer.git"
url  = "git+https://forge.rysieko.pl/rysieko/beer.git"
type = "fetch"

# everything else
[inputs.hyprland]
url = "github:hyprwm/Hyprland"
patches = [
  # render/hdr: avoid metadata modeset in DS ins/outs
  "https://github.com/hyprwm/Hyprland/pull/16946",
  # renderer: HDR -> SDR tonemapping fixes
  "https://github.com/hyprwm/Hyprland/pull/16966",
  # screenshare: DS fixes
  "https://github.com/hyprwm/Hyprland/pull/17015",
]

[inputs.niqspkgs]
url  = "github:diniamo/niqspkgs"
type = "fetch"

[inputs.nix-gaming]
url = "github:fufexan/nix-gaming"
type = "fetch"
patches = [
  # osu-lazer-bin: drop EGL bwrap override
  "https://github.com/fufexan/nix-gaming/pull/384",
]

[inputs.nixcord]
url  = "github:4evy/nixcord"
type = "fetch"

# non-flake inputs
[inputs.KvLibadwaita]
url  = "github:GabePoel/KvLibadwaita"
type = "fetch"

[inputs.tom-nvidia-patches]
url    = "https://github.com/gulafaran/open-gpu-kernel-modules/compare/main...patches.diff"
type   = "fixed"
unpack = "file"

[inputs.disblock-origin]
url = "git+https://codeberg.org/AllPurposeMat/Disblock-Origin.git"
type = "fetch"
patches = [
  # Fix Active Now quests CSS
  "https://codeberg.org/AllPurposeMat/Disblock-Origin/pulls/155",
  # Fix clan tags, boost upsells and dead selectors after Discord's class rename
  "https://codeberg.org/AllPurposeMat/Disblock-Origin/pulls/161",
]
