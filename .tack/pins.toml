# tack pins. edit by hand or with tack add / rm / alias

[shorturls]
fazzi   = "gitlab:fazzi/{path}"
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[all_follow]
nixpkgs = ["nixpkgs", "nixpkgs-lib", "nixpkgs-packages"]
systems = "systems"
# auto-dedup (no top-level pin needed):
flake-parts = "flake-parts"

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
names = [
  "nixpkgs-ci",
  "flake-compat",
  "home-manager",
  "nix-darwin",
  "treefmt-nix",
  "rust-analyzer",
  "rust-analyzer-src",
  "fenix",
  "pre-commit-hooks",
]

# core
[inputs.nixpkgs]
url = "channel:nixos-unstable"
patches = [
  # linuxPackages / aggregateModules: Minor improvements post-module-signing
  "https://github.com/NixOS/nixpkgs/pull/577219",
]
[inputs.systems]
url = "github:nix-systems/x86_64-linux"
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"
[inputs.hjem]
url = "github:feel-co/hjem"
[inputs.tack]
url = "github:manic-systems/tack"
[inputs.agenix]
url = "github:ryantm/agenix"

# things from yours truly
[inputs.azzipkgs]
url = "fazzi:azzipkgs"
[inputs.nvuv]
url = "fazzi:nvuv"
[inputs.startpage]
url  = "fazzi:startpage"
type = "fetch"
[inputs.walls]
url  = "fazzi:walls"
type = "fetch"
[inputs.creamlinux]
url = "github:fxzzi/creamlinux-installer"

# raf stuff :D
[inputs.nvf]
url = "github:NotAShelf/nvf"
[inputs.rags]
url = "github:NotAShelf/rags"
patches = [
  "https://github.com/NotAShelf/rags/pull/44",
  # "https://github.com/NotAShelf/rags/pull/45",
]
[inputs.beer]
# nix and tack fail to fetch from raf's git forge :(
# so fetch from a mirror instead
# url = "git+https://git.notashelf.dev/notashelf/beer.git"
url = "git+https://forge.rysieko.pl/rysieko/beer"

# everything else
[inputs.hyprland]
url = "github:hyprwm/Hyprland"

[inputs.niqspkgs]
url = "github:diniamo/niqspkgs"

[inputs.nix-gaming]
url = "github:fufexan/nix-gaming"

[inputs.nixcord]
url = "github:4evy/nixcord"

# non-flake inputs
[inputs.KvLibadwaita]
url  = "github:GabePoel/KvLibadwaita"
type = "fetch"

[inputs.nvidia-vaapi-driver]
url  = "github:elFarto/nvidia-vaapi-driver"
type = "fetch"
