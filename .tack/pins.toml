# tack pins. edit by hand or with tack add / rm / alias

[shorturls]
channel = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
fazzi   = "gitlab:fazzi/{path}"
raf     = "git+ssh://git@git.notashelf.dev:33/notashelf/{path}.git"

[all_follow]
nixpkgs = "nixpkgs"
systems = "systems"

# recursively omit selected upstream inputs from every top-level pin
[omit_inputs]
names = ["nixpkgs-ci", "flake-compat", "pre-commit-hooks"]

# core
[inputs.nixpkgs]
url = "channel:nixos-unstable"
patches = [
  # nvtop: 3.3.2 -> 3.4.0, merge nvtopPackages into a single package 
  "https://github.com/NixOS/nixpkgs/pull/586196",
  # mpd: 0.24.18 -> 0.24.20
  "https://github.com/NixOS/nixpkgs/pull/592049",
]
[inputs.systems]
url = "github:nix-systems/x86_64-linux"
[inputs.hjem]
url = "github:feel-co/hjem"
[inputs.nixos-core]
url = "github:manic-systems/nixos-core"
[inputs.ncro]
url  = "github:manic-systems/ncro"
type = "fetch"
[inputs.tack]
url  = "github:manic-systems/tack"
type = "fetch"
[inputs.agenix]
url  = "github:ryantm/agenix"
type = "fetch"

# things from yours truly
[inputs.azzipkgs]
url = "fazzi:azzipkgs"
[inputs.startpage]
url  = "fazzi:startpage"
type = "fetch"
[inputs.walls]
url  = "fazzi:walls"
type = "fetch"
[inputs.creamlinux]
url  = "github:fxzzi/creamlinux-installer"
type = "fetch"

# raf stuff :D
[inputs.nvf]
url = "github:NotAShelf/nvf"
[inputs.rags]
url  = "github:NotAShelf/rags"
type = "fetch"
[inputs.beer]
url     = "raf:beer"
type    = "fetch"
patches = ["./patches/beer/0001-I-hate-SCTK.patch"]
[inputs.chroma]
url  = "raf:chroma"
type = "fetch"

# everything else
[inputs.hyprland]
url = "github:hyprwm/Hyprland"
patches = [
  # renderer: HDR -> SDR tonemapping fixes
  "https://github.com/hyprwm/Hyprland/pull/16966",
  # screenshare: DS fixes
  "https://github.com/hyprwm/Hyprland/pull/17015",
  # pointer: use plane size hints for HW cursor
  "https://github.com/hyprwm/Hyprland/pull/17042",
]

[inputs.niqspkgs]
url  = "github:diniamo/niqspkgs"
type = "fetch"

[inputs.nix-gaming]
url  = "github:fufexan/nix-gaming"
type = "fetch"

[inputs.nixcord]
url  = "github:4evy/nixcord"
type = "fetch"

# non-flake inputs
[inputs.KvLibadwaita]
url  = "github:GabePoel/KvLibadwaita"
type = "fetch"

[inputs.tom-nvidia-patches]
url    = "https://github.com/gulafaran/open-gpu-kernel-modules/compare/main...patches.diff"
type   = "fixed"
unpack = "file"

[inputs.disblock-origin]
url     = "git+https://codeberg.org/AllPurposeMat/Disblock-Origin.git"
type    = "fetch"
patches = ["https://codeberg.org/AllPurposeMat/Disblock-Origin/pulls/163"]
